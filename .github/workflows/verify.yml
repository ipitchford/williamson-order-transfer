name: Exact evidence replay
on:
  push:
  pull_request:
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        optimise: ["", "-O"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - name: Replay exact checks and corruption controls
        run: python -B ${{ matrix.optimise }} code/replay.py
